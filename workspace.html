<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photopea Book Cover Studio</title>
  <style>
    body {font:14px system-ui,sans-serif;margin:0;background:#161b24;color:#fff;display:flex;flex-direction:column;min-height:100dvh}
    .toolbar, #downloads {padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    input,button {font:inherit;padding:8px;border:0;border-radius:5px}
    button {background:#e0f0fe;color:#091527;cursor:pointer}
    button:disabled {opacity:.4;cursor:default}
    #status {flex:1;min-width:200px}
    iframe {border:0;flex:1;min-height:65vh;width:100%}
    dialog {max-width:min(720px,90vw);color:#161b24}
    pre {max-height:45vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
    #downloads:empty {display:none}
  </style>
  <script src="/workspace.js" defer></script>
</head>
<body>
  <div class="toolbar">
    <strong>Photopea Cover Studio</strong>
    <input id="token" type="password" maxlength="512" autocomplete="off" aria-label="Bridge key" placeholder="Bridge key">
    <button id="connect">Pair workspace</button>
    <button id="openFile" disabled>Open local PSD or image</button>
    <input type="file" id="file" accept=".psd,.png,.jpg,.jpeg,.svg,.pdf,.webp" hidden>
    <span id="status" role="status">Loading Photopea…</span>
  </div>
  <div id="downloads" aria-label="Recent exports"></div>
  <iframe id="pp" title="Photopea" sandbox="allow-same-origin allow-scripts allow-downloads allow-popups allow-forms"></iframe>
  <dialog id="approval">
    <h2>Allow this Photopea script?</h2>
    <pre id="script"></pre>
    <button id="decline">Decline</button>
    <button id="approve">Run script</button>
  </dialog>
</body>
</html>
