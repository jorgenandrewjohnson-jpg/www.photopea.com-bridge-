<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Brave KDP Bridge</title>
<style>body{font:14px system-ui;width:350px;margin:16px;color:#18232e}input,button,select{font:inherit;box-sizing:border-box;max-width:100%;padding:5px}label{display:block;margin:8px 0}pre,p{white-space:pre-wrap;overflow-wrap:anywhere}section{border-top:1px solid #ddd;margin-top:12px}button{margin:4px 3px 4px 0}</style>
<h2>Brave KDP Bridge</h2><label>Service origin <input id="origin" type="url" placeholder="https://…onrender.com"></label>
<button id="pair">Start pairing</button><button id="disconnect">Disconnect</button><p id="status" role="status"></p>
<section><h3>Stage a publishing file</h3><p>Open the edition’s Content tab. Select the downloaded Drive manuscript or finished cover for this edition.</p>
<label>File role <select id="kind"><option>manuscript</option><option>cover</option></select></label><input id="file" type="file"><p id="fileStatus"></p><div id="staged"></div></section>
<section id="publication" hidden><h3>Confirm publication</h3><pre id="review"></pre><button id="confirm">Publish this edition once</button><button id="deny">Decline</button></section>
<script type="module" src="popup.js"></script></html>
