<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark;font:14px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:12px;color:CanvasText;background:Canvas}main{border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:14px;padding:16px;max-width:780px;margin:auto}h1{font-size:19px;margin:0 0 4px}h2{font-size:14px;margin:20px 0 8px}p{line-height:1.45;margin:6px 0}.muted{opacity:.75}.top,.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.line{border-top:1px solid color-mix(in srgb,CanvasText 13%,transparent);padding:8px 0}.line span:last-child{text-align:right;overflow-wrap:anywhere}.top{flex-wrap:wrap}button,select{font:inherit;color:CanvasText;background:Canvas;border:1px solid color-mix(in srgb,CanvasText 35%,transparent);border-radius:8px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}#choices{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}#error{color:#b45309}#edition{font-weight:650;font-size:16px}ul{margin:6px 0;padding-left:22px}footer{margin-top:16px;font-size:12px;opacity:.8}
</style></head><body><main><div class="top"><div><h1>KDP publishing workspace</h1><p id="bridge" class="muted">Waiting for live bridge status</p></div><button id="refresh" disabled>Refresh</button></div>
<p id="edition">Waiting for edition data</p><div id="choices"></div><div id="summary"></div><div id="checks"></div><p id="next" role="status"></p><p id="error" role="alert"></p><footer>Read-only live observations. Unknown checks are not approvals. Publishing always requires separate explicit approval in chat and Brave.</footer></main>
<script type="module">
const $=id=>document.getElementById(id);
const tool='kdp_publishing_dashboard';let seq=0,selected=null,busy=false,ready=false;const pending=new Map();
const send=(method,params)=>parent.postMessage({jsonrpc:'2.0',method,params},'*');
function rpc(method,params){return new Promise((resolve,reject)=>{const id=++seq;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('Host response timed out'));},90000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
const human=v=>v==null?'Unknown':String(v).replaceAll('_',' ');
function row(parent,label,value){const el=document.createElement('div');el.className='line';const a=document.createElement('span'),b=document.createElement('span');a.textContent=label;b.textContent=human(value);el.append(a,b);parent.append(el)}
function heading(parent,text){const el=document.createElement('h2');el.textContent=text;parent.append(el)}
function render(data){if(!data||!data.bridge||typeof data.status!=='string')return;selected=data.edition_id??null;$('bridge').textContent=(data.bridge.paired?'Brave connected':'Brave disconnected')+' · Bridge '+data.bridge.version;$('edition').textContent=data.title|| (selected?'Edition '+selected:'Choose a saved edition');$('choices').replaceChildren();for(const id of data.available_ids??[]){const b=document.createElement('button');b.textContent=id;b.addEventListener('click',()=>refresh(id));b.disabled=busy||!ready;$('choices').append(b)}
const s=$('summary');s.replaceChildren();heading(s,'Edition overview');row(s,'Format',data.edition);row(s,'Observation',data.status);row(s,'Current stage',data.current_stage);row(s,'ISBN',data.isbn);row(s,'US list price',data.amazon_com_list_price_usd?'$'+data.amazon_com_list_price_usd:null);row(s,'Rights',data.rights);
const c=$('checks');c.replaceChildren();heading(c,'Release checks');for(const [key,value] of Object.entries(data.preflight?.checks??{}))row(c,human(key),value);if(data.blockers?.length){heading(c,'Observed blockers');const ul=document.createElement('ul');for(const blocker of data.blockers){const li=document.createElement('li');li.textContent=human(blocker);ul.append(li)}c.append(ul)}$('next').textContent=data.next_action||'';updateSize()}
function updateSize(){send('ui/notifications/size-changed',{height:Math.ceil(document.documentElement.scrollHeight)})}
function enable(){ $('refresh').disabled=!ready||busy;for(const b of $('choices').querySelectorAll('button'))b.disabled=!ready||busy}
async function refresh(id=selected){if(!ready||busy)return;busy=true;enable();$('error').textContent='';try{const r=await rpc('tools/call',{name:tool,arguments:id?{edition_id:id}:{}});if(r?.isError||!r?.structuredContent?.bridge)throw new Error('No verified dashboard result');render(r.structuredContent)}catch{$('error').textContent='Could not refresh live data. The displayed observations may be stale.'}finally{busy=false;enable();updateSize()}}
window.addEventListener('message',event=>{if(event.source!==parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(typeof m.id==='number'){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent)});
$('refresh').addEventListener('click',()=>refresh());
rpc('ui/initialize',{appInfo:{name:'kdp-publishing-dashboard',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{send('ui/notifications/initialized',{});ready=true;enable();updateSize()}).catch(()=>{$('error').textContent='Interactive host connection unavailable. Use the chat tools to refresh.'});
</script></body></html>
